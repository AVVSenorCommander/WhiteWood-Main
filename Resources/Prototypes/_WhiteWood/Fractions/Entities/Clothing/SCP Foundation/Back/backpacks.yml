- type: entity
  parent: Clothing
  id: ClothingBackpackSCPLight
  suffix: МОГ
  name: легкий армейский рюкзак
  description: Стандартный рюгзак для военных подразделений. Предназначен для переноски снаряжения на поле боя.
  components:
  - type: Sprite
    sprite: _WhiteWood/Fractions/Clothing/SCP Foundation/Back/Backpacks/light.rsi
    state: icon
  - type: Item
    size: Large
  - type: Clothing
    quickEquip: false
    slots:
    - back
  - type: Storage
    quickInsert: true
    grid:
    - 0,0,6,4 # TODO: Change this
    maxItemSize: Huge
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
        ents: []
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  - type: UseDelay
    delay: 0.4

