
#Лёгкая Броня

- type: entity
  parent: [ClothingOuterBaseMedium, AllowSuitStorageClothing]
  id: ClothingOuterArmorSentrySCP
  name: бронежилет
  suffix: SCP
  description: Применяется в комендантском отряде службы безопасности Фонда.
  components:
  - type: Sprite
    sprite: _WhiteWood/Fractions/Clothing/SCP Foundation/OuterClothing/Armor/armor_sentry_guards.rsi
  - type: Clothing
    sprite: _WhiteWood/Fractions/Clothing/SCP Foundation/OuterClothing/Armor/armor_sentry_guards.rsi
  - type: Armor #Based on /tg/ but slightly compensated to fit the fact that armor stacks in SS14.
    modifiers:
      coefficients:
        Blunt: 0.70
        Slash: 0.70
        Piercing: 0.70 #Can save you, but bullets will still hurt. Will take about 10 shots from a Viper before critting, as opposed to 7 while unarmored and 16~ with a bulletproof vest.
        Heat: 0.80
  - type: ExplosionResistance
    damageCoefficient: 0.90

