# Тяжёлая Броня

- type: entity
  parent: [ClothingOuterBaseMedium, AllowSuitStorageClothing]
  id: ClothingOuterArmorHeavySCP
  name: тяжёлая броня
  suffix: SCP, ПХ, МОГ
  description: Изготовленный на заказ комплект специальный комплект брони. Разработан специально для высокопоставленных офицеров, сотрудников службы безопасности и корпоративных наемников. Этот костюм выглядит так, как будто принадлежит офицеру высокого ранга.
  components:
  - type: Sprite
    sprite: _WhiteWood/Fractions/Clothing/SCP Foundation/OuterClothing/Armor/heavy.rsi
  - type: Clothing
    sprite: _WhiteWood/Fractions/Clothing/SCP Foundation/OuterClothing/Armor/heavy.rsi
  - type: Armor #Based on /tg/ but slightly compensated to fit the fact that armor stacks in SS14.
    modifiers:
      coefficients:
        Blunt: 0.20
        Slash: 0.20
        Piercing: 0.20
        Heat: 0.35
        Caustic: 0.30
  - type: ExplosionResistance
    damageCoefficient: 0.40
  - type: ClothingSpeedModifier
    walkModifier: .790
    sprintModifier: .790
