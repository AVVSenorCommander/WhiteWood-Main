# BaseWall
- type: entity
  abstract: true
  parent: BaseStructure
  id: CMBaseWall
  suffix: CM, Неразрушимый
  description: A huge chunk of metal used to separate rooms.
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
  - type: Sprite
    drawdepth: Walls
  - type: Icon
    state: full
  - type: PlacementReplacement
    key: walls
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Metallic
  - type: Occluder
  - type: Airtight
  - type: RadiationBlocker
    resistance: 2
  - type: StaticPrice
    price: 75
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        mask:
        - FullTileMask
        layer:
        - WallLayer
        density: 1000


# Standart СM
- type: entity
  parent: CMBaseWall
  id: CMWallMetal
  name: стена
  suffix: CM, Неразрушимый
  description: Огромный кусок металла, используемый для разделения комнат.
  components:
  - type: Sprite
    sprite: _WhiteWood/Fractions/Structures/Walls/UGE/metal.rsi
  - type: Icon
    sprite: _WhiteWood/Fractions/Structures/Walls/UGE/metal.rsi
  - type: Tag
    tags:
      - Wall
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviours:
      - !type:SpawnEntitiesBehavior
        spawn:
          CMGirder:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: IconSmooth
    key: walls
    base: metal

- type: entity
  parent: CMWallMetal
  id: CMWallMetalAlmayer
  name: стена
